name: Scraper

# Se lanza a mano (Actions -> Scraper -> Run workflow) o desde el botón "Forzar scraper" del panel.
# Cuando haya fuentes configuradas, descomenta `schedule` para programarlo.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ejecutar scraper
        run: pnpm scraper
        env:
          # Secret del repositorio: Settings -> Secrets and variables -> Actions
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
