# Despliegue en Netlify: frontend estático + API como Netlify Function (netlify/functions/api.ts).
# Variables en Site settings → Environment variables:
#   DATABASE_URL (Neon, solo servidor · marcar "Contains secret values"),
#   opcionales: USD_TO_PEN_RATE, VITE_ADMIN_WHATSAPP, VITE_USD_TO_PEN_RATE,
#   GITHUB_PAT, GITHUB_REPO, GITHUB_WORKFLOW, GITHUB_REF (botón "Forzar scraper").

[build]
  command = "pnpm exec vite build"
  publish = "dist/public"

  [build.environment]
    # Estas variables son públicas (los VITE_* viajan en el bundle del navegador y el tipo de
    # cambio es un dato abierto; GITHUB_REPO/WORKFLOW/REF son nombres públicos), así que no deben
    # tratarse como secretos. DATABASE_URL SÍ se
    # sigue escaneando: nunca debe aparecer en el repositorio ni en el build.
    SECRETS_SCAN_OMIT_KEYS = "USD_TO_PEN_RATE,VITE_USD_TO_PEN_RATE,VITE_ADMIN_WHATSAPP,ALERT_STALE_HOURS,GITHUB_REF,GITHUB_WORKFLOW,GITHUB_REPO"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# La API (netlify/functions/api.ts) va antes que el fallback del SPA.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Enrutamiento del lado del cliente.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad. Mantener sincronizadas con server/index.ts (Express).
# Si la API vive en otro dominio (VITE_API_URL), añádelo a connect-src.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Los assets de Vite llevan hash: cache de largo plazo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
