<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">REAL ESTATE SCRAPER</title>
  <desc id="d">Inteligencia inmobiliaria para Perú: avisos de varios portales en un solo lugar, con filtros, comparación de precios y vista previa con fotos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1015"/><stop offset="1" stop-color="#0a0c10"/></linearGradient>
    <radialGradient id="gold" cx="0.82" cy="0.1" r="0.7"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue" cx="0.05" cy="1" r="0.7"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet" cx="0.55" cy="0.0" r="0.5"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.14"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <linearGradient id="gtxt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="photo1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b4a2f"/><stop offset="0.55" stop-color="#b98a54"/><stop offset="1" stop-color="#e9c98f"/></linearGradient>
    <linearGradient id="photo2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#27425f"/><stop offset="1" stop-color="#7aa6d6"/></linearGradient>
    <linearGradient id="photo3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f5a49"/><stop offset="1" stop-color="#8fc7a7"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
    <clipPath id="clipCard"><rect x="0" y="0" width="300" height="168" rx="18"/></clipPath>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#gold)"/>
  <rect width="1280" height="440" fill="url(#blue)"/>
  <rect width="1280" height="440" fill="url(#violet)"/>
  <rect x="0.5" y="0.5" width="1279" height="439" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Marca -->
  <rect x="64" y="58" width="52" height="52" rx="14" fill="#f4f1ea"/>
  <path d="M90 70 L104 82 V99 H96 V89 H84 V99 H76 V82 Z" fill="#14161b"/>
  <text x="132" y="82" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="1.6" fill="url(#gtxt)">REAL ESTATE</text>
  <text x="133" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="5.5" fill="#98a0ac">SCRAPER</text>

  <!-- Titular -->
  <text x="64" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#ece8e1">Inteligencia inmobiliaria</text>
  <text x="64" y="248" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="url(#gtxt)">para el mercado peruano</text>
  <text x="64" y="288" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#98a0ac">Avisos de varios portales en un solo lugar: busca, compara precios,</text>
  <text x="64" y="314" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#98a0ac">mira todas las fotos y entiende cada propiedad en segundos.</text>

  <!-- Portales -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="64" y="352" width="124" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="85" cy="369" r="5" fill="#10B981"/><text x="97" y="374" fill="#ece8e1">Adondevivir</text>
    <rect x="200" y="352" width="108" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="221" cy="369" r="5" fill="#EC4899"/><text x="233" y="374" fill="#ece8e1">Urbania</text>
    <rect x="320" y="352" width="116" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="341" cy="369" r="5" fill="#8B5CF6"/><text x="353" y="374" fill="#ece8e1">InfoCasas</text>
    <rect x="448" y="352" width="116" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/><circle cx="469" cy="369" r="5" fill="#3B82F6"/><text x="481" y="374" fill="#ece8e1">Properati</text>
  </g>

  <!-- Tarjetas de cristal (derecha) -->
  <g transform="translate(836 42) rotate(4 150 90)" filter="url(#sh)">
    <rect width="300" height="168" rx="18" fill="#171b22"/>
    <g clip-path="url(#clipCard)">
      <rect width="300" height="108" fill="url(#photo1)"/>
      <path d="M0 108 L70 58 L120 88 L190 40 L300 96 V108 Z" fill="#000" fill-opacity="0.22"/>
      <circle cx="238" cy="34" r="16" fill="#fff" fill-opacity="0.55"/>
      <rect width="300" height="168" fill="url(#glass)"/>
    </g>
    <rect x="14" y="14" width="84" height="24" rx="12" fill="#000" fill-opacity="0.5"/><circle cx="28" cy="26" r="4" fill="#EC4899"/><text x="38" y="30" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#fff">Urbania</text>
    <rect x="218" y="14" width="68" height="24" rx="12" fill="#EF4444"/><text x="230" y="30" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#10131a">VENTA</text>
    <text x="16" y="136" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="21" font-weight="700" fill="#4ade80">USD 207,000</text>
    <text x="16" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#98a0ac">3 dorm. · 2 baños · 87 m² · San Isidro</text>
    <rect x="0.5" y="0.5" width="299" height="167" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  </g>

  <g transform="translate(1000 222) rotate(-5 120 80)" filter="url(#sh)">
    <rect width="240" height="150" rx="18" fill="#171b22"/><rect width="240" height="150" rx="18" fill="url(#glass)"/>
    <rect x="16" y="16" width="34" height="34" rx="11" fill="#22d3ee" fill-opacity="0.22" stroke="#22d3ee" stroke-opacity="0.5"/>
    <path d="M25 41 V35 M33 41 V28 M41 41 V32" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <text x="60" y="30" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#98a0ac">Mediana del distrito</text>
    <text x="60" y="48" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#ece8e1">USD 1,850 / m²</text>
    <path d="M16 118 C46 112 62 92 90 98 S140 70 166 78 S210 52 226 44 V132 H16 Z" fill="url(#spark)"/>
    <path d="M16 118 C46 112 62 92 90 98 S140 70 166 78 S210 52 226 44" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <circle cx="226" cy="44" r="5" fill="#22d3ee" stroke="#171b22" stroke-width="2"/>
    <rect x="0.5" y="0.5" width="239" height="149" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  </g>

  <g transform="translate(790 262) rotate(-2 90 50)" filter="url(#sh)">
    <rect width="200" height="104" rx="18" fill="#171b22"/><rect width="200" height="104" rx="18" fill="url(#glass)"/>
    <rect x="14" y="14" width="40" height="40" rx="12" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-opacity="0.5"/>
    <path d="M24 36 L32 44 L45 26" fill="none" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="30" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#98a0ac">Frente a la mediana</text>
    <text x="64" y="52" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#4ade80">-12 %</text>
    <rect x="14" y="68" width="172" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/><rect x="14" y="68" width="76" height="10" rx="5" fill="url(#btn)"/>
    <text x="14" y="94" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#98a0ac">Por debajo del mercado</text>
    <rect x="0.5" y="0.5" width="199" height="103" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  </g>

</svg>
